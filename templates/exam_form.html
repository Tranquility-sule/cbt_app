{% extends "base.html" %}
{% block title %}New Exam{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="eyebrow">Teacher Portal</div>
        <h2>Create Exam</h2>
    </div>
</div>
<div class="card">
    <form method="POST">
        <label>Title</label>
        <input type="text" name="title" required>
        <label>Subject</label>
        <input type="text" name="subject" required>
        <label>Class (optional, e.g. SS3)</label>
        <input type="text" name="class_level" placeholder="e.g. SS3">
        <label>Restrict to Department (optional)</label>
        <input type="text" name="restricted_department" placeholder="e.g. Computer Science — leave blank to allow every student">
        <p class="text-muted" style="margin-top:-8px;">If set, only students whose account department matches exactly (not case-sensitive) can see or start this exam. Leave blank for an exam open to everyone.</p>
        <label>Duration (minutes)</label>
        <input type="number" name="duration_minutes" value="30" required>
        <label>Pass Mark (%)</label>
        <input type="number" name="pass_mark" value="50" step="0.1">
        <br><br>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;color:var(--text);">
            <input type="checkbox" name="shuffle_questions" checked> Shuffle question order per student
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;color:var(--text);">
            <input type="checkbox" name="shuffle_options" checked> Shuffle answer options per student
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;color:var(--text);">
            <input type="checkbox" name="unlock_immediately"> Unlock immediately (students can start right away — otherwise it stays locked until you unlock it from the dashboard)
        </label>
        <br>
        <button class="btn" type="submit">Create Exam</button>
    </form>
</div>
{% endblock %}
